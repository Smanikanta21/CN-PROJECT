worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream project_backends {
        server 10.7.19.89:3001 max_fails=1 fail_timeout=10s;   # Backend A - Mac 4
        server 10.7.28.31:3002 max_fails=1 fail_timeout=10s;   # Backend B - Mac 3
    }

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name app.routex.test api.routex.test;

        ssl_certificate     /Users/shaikjunaidsami/cn-project/tls/app.routex.test.crt;
        ssl_certificate_key /Users/shaikjunaidsami/cn-project/tls/app.routex.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://project_backends;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Edge primary always;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
